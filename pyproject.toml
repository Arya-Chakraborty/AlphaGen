[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecule-gen"
version = "0.1.0"
description = "Generate molecules that match user-specified Mordred descriptor ranges."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "rdkit>=2024.3",
    "mordredcommunity>=2.0",
    "selfies>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.2"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[project.scripts]
molecule-gen = "molecule_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call Mordred on real molecules",
]
